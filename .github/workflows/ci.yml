name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# Cancel older runs of the same ref so PR pushes don't pile up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  imports:
    name: test_imports (fast)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: pytest tests/test_imports.py
        env:
          PYTHONIOENCODING: utf-8
        run: pytest tests/test_imports.py -v

  e2e:
    name: test_e2e (run_all.sh --quick)
    runs-on: ubuntu-latest
    needs: imports
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Make scripts/run_all.sh executable
        run: chmod +x scripts/run_all.sh

      - name: pytest tests/test_e2e.py (run_all.sh --quick under the hood)
        env:
          PYTHONIOENCODING: utf-8
          AML_E2E_TIMEOUT: "2400"  # 40 minutes for the cold pipeline in CI
        run: pytest tests/test_e2e.py -m e2e -v --tb=short

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation_report
          path: |
            reports/evaluation_report.json
            artifacts/evaluation_report.json
            artifacts/transaction_metrics.json
            artifacts/community_metrics.json
            artifacts/pattern_metrics.json
          if-no-files-found: warn
